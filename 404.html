<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>404 — Maddie Rochovansky</title>
<meta name="robots" content="noindex">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%230a0a0c'/%3E%3Ctext x='50%25' y='54%25' dominant-baseline='middle' text-anchor='middle' font-family='Georgia,serif' font-size='18' fill='%23c9a84c'%3EM%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<style>
.error-screen {
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  position: relative;
  z-index: 2;
  padding: 2rem;
  text-align: center;
}
.error-code {
  font-family: 'Cormorant Garamond', serif;
  font-size: clamp(6rem, 20vw, 12rem);
  font-weight: 300;
  color: var(--gold);
  line-height: 1;
  letter-spacing: -0.04em;
  opacity: 0.18;
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -60%);
  pointer-events: none;
  user-select: none;
}
.error-content {
  position: relative;
  z-index: 1;
  max-width: 480px;
}
.error-label {
  display: inline-flex;
  align-items: center;
  gap: 0.75rem;
  font-size: 0.68rem;
  letter-spacing: 0.2em;
  text-transform: uppercase;
  color: var(--gold);
  font-weight: 500;
  margin-bottom: 1.25rem;
}
.error-label::before {
  content: "";
  width: 24px;
  height: 1px;
  background: var(--gold-border);
}
.error-title {
  font-family: 'Cormorant Garamond', serif;
  font-size: clamp(2rem, 5vw, 3.2rem);
  font-weight: 300;
  line-height: 1.15;
  color: var(--text);
  margin-bottom: 1.25rem;
  letter-spacing: -0.015em;
}
.error-title em {
  font-style: italic;
  color: var(--gold);
}
.error-sub {
  font-size: 0.95rem;
  color: var(--text2);
  font-weight: 300;
  line-height: 1.8;
  margin-bottom: 0.75rem;
}
.error-fun {
  font-size: 0.82rem;
  color: var(--text3);
  font-style: italic;
  font-weight: 300;
  line-height: 1.7;
  margin-bottom: 2.5rem;
  min-height: 1.4rem;
  transition: opacity 0.3s;
}
.error-actions {
  display: flex;
  flex-wrap: wrap;
  gap: 0.75rem;
  justify-content: center;
}
</style>
</head>
<body>

<div id="starfield"></div>
<canvas id="meteors" aria-hidden="true"></canvas>

<nav>
  <a href="/" class="nav-logo">Maddie Rochovansky</a>
</nav>

<div class="error-screen">
  <div class="error-code">404</div>
  <div class="error-content">
    <div class="error-label">Page not found</div>
    <h1 class="error-title">Nothing to see <em>here.</em></h1>
    <p class="error-sub">This page does not exist, was moved, or wandered off without documenting where it was going.</p>
    <p class="error-fun" id="error-fun">Which, for the record, is exactly the kind of thing I fix.</p>
    <div class="error-actions">
      <a href="/" class="btn-gold">Back to Home</a>
      <a href="/#contact" class="btn-outline">Get in Touch</a>
    </div>
  </div>
</div>

<script>
(function () {
  var sf = document.getElementById('starfield');
  for (var i = 0; i < 130; i++) {
    var s = document.createElement('div');
    s.className = 'star';
    var sz = Math.random() * 2 + 0.4;
    s.style.cssText = 'width:' + sz + 'px;height:' + sz + 'px;left:' + Math.random() * 100 + '%;top:' + Math.random() * 100 + '%;--dur:' + (2 + Math.random() * 5) + 's;--delay:' + (Math.random() * 6) + 's;--lo:' + (0.05 + Math.random() * 0.15) + ';--hi:' + (0.4 + Math.random() * 0.55);
    sf.appendChild(s);
  }

  var cv = document.getElementById('meteors');
  var ctx = cv.getContext('2d');
  function rsz() { cv.width = innerWidth; cv.height = innerHeight; }
  rsz();
  window.addEventListener('resize', rsz);

  function Meteor(init) { this.reset(init); }
  Meteor.prototype.reset = function (init) {
    this.x = Math.random() * innerWidth * 1.4 - innerWidth * 0.2;
    this.y = init ? Math.random() * -innerHeight : -80;
    this.len = 90 + Math.random() * 130;
    this.spd = 1.6 + Math.random() * 2.2;
    this.ang = Math.PI / 4 + (Math.random() - 0.5) * 0.25;
    this.w = 0.4 + Math.random() * 0.9;
    this.life = 0; this.maxLife = 70 + Math.random() * 110;
    this.peak = 0.25 + Math.random() * 0.4;
  };
  Meteor.prototype.draw = function () {
    this.life++;
    var fi = 18, fo = 22, a;
    if (this.life < fi) a = (this.life / fi) * this.peak;
    else if (this.life > this.maxLife - fo) a = ((this.maxLife - this.life) / fo) * this.peak;
    else a = this.peak;
    if (this.life >= this.maxLife) this.reset();
    var tx = this.x - Math.cos(this.ang) * this.len, ty = this.y - Math.sin(this.ang) * this.len;
    this.x += Math.cos(this.ang) * this.spd;
    this.y += Math.sin(this.ang) * this.spd;
    var g = ctx.createLinearGradient(tx, ty, this.x, this.y);
    g.addColorStop(0, 'transparent');
    g.addColorStop(1, 'rgba(201,168,76,' + a + ')');
    ctx.beginPath(); ctx.moveTo(tx, ty); ctx.lineTo(this.x, this.y);
    ctx.strokeStyle = g; ctx.lineWidth = this.w; ctx.stroke();
  };

  var meteors = [];
  for (var i = 0; i < 10; i++) meteors.push(new Meteor(true));
  function animLoop() {
    ctx.clearRect(0, 0, cv.width, cv.height);
    for (var i = 0; i < meteors.length; i++) meteors[i].draw();
    requestAnimationFrame(animLoop);
  }
  animLoop();

  var lines = [
    "Which, for the record, is exactly the kind of thing I fix.",
    "Checked twice. It is definitely not here.",
    "The process that led you here could use some work.",
    "Undocumented. Classic.",
    "This would not have happened with a proper redirect map.",
    "Somewhere, a broken link is living its best life."
  ];
  var el = document.getElementById('error-fun');
  var idx = Math.floor(Math.random() * lines.length);
  el.textContent = lines[idx];
})();
</script>

</body>
</html>
