  .projects-page { padding-top: calc(var(--nav-h) + 3rem); padding-bottom: 5rem; }

  .projects-page-sub { font-size: 0.88rem; color: var(--text3); margin-bottom: 2.5rem; font-weight: 300; }

    display: grid;
    grid-template-columns: repeat(4, minmax(0, 1fr));

    margin-bottom: 1rem;

  .projects-summary-card {
    border: 1px solid var(--border2);

  .projects-search { width: 100%; background: var(--bg2); border: 1px solid var(--border2); border-radius: var(--radius); padding: 0.65rem 1rem; color: var(--text); font-size: 0.85rem; font-family: 'DM Sans', sans-serif; outline: none; transition: border-color 0.2s; }
  .projects-search:focus { border-color: var(--gold-border); }
  .projects-search::placeholder { color: var(--text3); }
  .no-results { padding: 3rem; text-align: center; color: var(--text3); font-size: 0.85rem; border: 1px solid var(--border); border-radius: var(--radius); }

  .cat-label-automation { color: var(--text3); }
  .cat-label-process    { color: var(--text3); }

  .cat-label-financial  { color: var(--text3); }

<style>

  .proj-list-card:hover { background: var(--bg2); }
  .proj-list-card-inner { flex: 1; min-width: 0; }
  .proj-list-card-top { margin-bottom: 0.75rem; }
  .proj-list-card-meta {
    display: flex;
    align-items: center;
    gap: 0.5rem;
    flex-wrap: wrap;
    margin-bottom: 0.4rem;
  }
  .proj-list-card-cat {
    font-size: 0.6rem;

    text-transform: uppercase;
    color: var(--gold);

  }
  .proj-list-card-date {
    font-size: 0.7rem;
    color: var(--text3);
    margin-left: auto;
  }
  .proj-list-card-name {
    font-family: 'Cormorant Garamond', serif;
    font-size: clamp(1.1rem, 2.5vw, 1.4rem);
    font-weight: 300;
    color: var(--text);
    margin-bottom: 0.35rem;
    line-height: 1.2;
  }
  .proj-list-card-preview {
    font-size: 0.82rem;
    color: var(--text2);
    line-height: 1.6;
    font-weight: 300;
  }
  .proj-list-card-bottom {
    display: flex;
    align-items: center;
    gap: 1rem;
    flex-wrap: wrap;
    margin-top: 0.75rem;
  }
  .proj-list-card-impact {
    font-size: 0.72rem;

  .proj-list-card-tools {

<script src="data/projects.js"></script>
<script>
(function () {
  // ── Category display config ──────────────────────────────────────────────
  var CAT_LABELS = {
    automation: 'Automation',
    process:    'Process Improvement',
    data:       'Data & Analytics',
    financial:  'Financial',
    systems:    'Systems & IT',
    web:        'Development',
  };

  var CAT_ORDER = ['automation', 'process', 'data', 'financial', 'systems', 'web'];

  // ── State ────────────────────────────────────────────────────────────────
  var activeFilter = 'all';
  var searchQuery  = '';

  function buildSummary() {
    var summaryEl = document.getElementById('projects-summary');
    if (!summaryEl) return;

    var total = PROJECTS.length;
    var complete = PROJECTS.filter(function (p) { return p.status === 'complete'; }).length;
    var ongoing = PROJECTS.filter(function (p) { return p.status === 'ongoing'; }).length;
    var categories = Object.keys(CAT_LABELS).filter(function (cat) {
      return PROJECTS.some(function (p) { return p.category === cat; });
    }).length;

    summaryEl.innerHTML = [
      { value: total + '+', label: 'Projects documented' },
      { value: complete, label: 'Completed projects' },
      { value: ongoing, label: 'Active projects' },
      { value: categories, label: 'Capability lanes' }
    ].map(function (item) {
      return '<div class="projects-summary-card">' +
        '<div class="projects-summary-value">' + item.value + '</div>' +
        '<div class="projects-summary-label">' + item.label + '</div>' +
      '</div>';
    }).join('');
  }

  // ── Build filter buttons ─────────────────────────────────────────────────
  function buildFilters() {
    var container = document.getElementById('proj-filters');
    var counts = { all: PROJECTS.length };
    PROJECTS.forEach(function (p) {
      counts[p.category] = (counts[p.category] || 0) + 1;
    });

    var allBtn = document.createElement('button');
    allBtn.className = 'proj-filter-btn active show';
    allBtn.dataset.cat = 'all';
    allBtn.innerHTML = 'All <span class="proj-filter-count">(' + counts.all + ')</span>';
    allBtn.onclick = function () { setFilter('all', allBtn); };
    container.appendChild(allBtn);

    CAT_ORDER.forEach(function (cat) {
      if (!counts[cat]) return;
      var btn = document.createElement('button');
      btn.className = 'proj-filter-btn show';
      btn.dataset.cat = cat;
      btn.innerHTML = CAT_LABELS[cat] + ' <span class="proj-filter-count">(' + counts[cat] + ')</span>';
      btn.onclick = function () { setFilter(cat, btn); };
      container.appendChild(btn);
    });
  }

  function setFilter(cat, btn) {
    activeFilter = cat;
    document.querySelectorAll('.proj-filter-btn').forEach(function (b) {
      b.classList.remove('active');
    });
    btn.classList.add('active');
    renderGrid();
  }

  // ── Build project cards ──────────────────────────────────────────────────
  function statusBadge(status) {
    if (status === 'complete') {
      return '<span class="proj-status-badge complete">Complete</span>';
    }
    return '<span class="proj-status-badge ongoing">Ongoing</span>';
  }

  function toolChips(tools) {
    if (!tools || !tools.length) return '';
    return tools.slice(0, 4).map(function (t) {
      return '<span class="tool-chip tc-' + t.type + '">' + t.label + '</span>';
    }).join('');
  }

  function buildCard(p) {
    var card = document.createElement('a');
    card.className = 'proj-list-card fade show';
    card.href = '/projects/' + p.slug;
    card.dataset.cat = p.category;
    card.dataset.name = p.name.toLowerCase();
    card.dataset.preview = (p.preview || '').toLowerCase();
    card.dataset.impact = (p.impact || '').toLowerCase();

    var catLabel = CAT_LABELS[p.category] || p.category;

    // Apply search highlighting if there's a search query
    var highlightedName = searchQuery ? highlightSearchTerm(p.name, searchQuery) : p.name;
    var highlightedPreview = searchQuery ? highlightSearchTerm(p.preview || '', searchQuery) : (p.preview || '');
    var highlightedImpact = searchQuery ? highlightSearchTerm(p.impact || '', searchQuery) : (p.impact || '');

    card.innerHTML =
      '<div class="proj-list-card-inner">' +
        '<div class="proj-list-card-top">' +
          '<div class="proj-list-card-meta">' +
            '<span class="proj-list-card-cat">' + catLabel + '</span>' +
            statusBadge(p.status) +
            '<span class="proj-list-card-date">' + p.date + '</span>' +
          '</div>' +
          '<h2 class="proj-list-card-name">' + highlightedName + '</h2>' +
          '<p class="proj-list-card-preview">' + highlightedPreview + '</p>' +
        '</div>' +
        '<div class="proj-list-card-bottom">' +
          '<div class="proj-list-card-impact">' + highlightedImpact + '</div>' +
          '<div class="proj-list-card-tools">' + toolChips(p.tools) + '</div>' +
        '</div>' +
      '</div>' +
      '<div class="proj-list-card-arrow">' +
        '<svg viewBox="0 0 24 24"><polyline points="9 18 15 12 9 6"></polyline></svg>' +
      '</div>';

    return card;
  }

  // ── Render / filter ──────────────────────────────────────────────────────
  function renderGrid() {
    var grid    = document.getElementById('proj-grid');
    var noRes   = document.getElementById('no-results');
    var q       = searchQuery.toLowerCase();
    var visible = 0;

    grid.innerHTML = '';

    PROJECTS.forEach(function (p) {
      var catMatch = activeFilter === 'all' || p.category === activeFilter;
      var searchMatch = !q ||
        p.name.toLowerCase().indexOf(q) !== -1 ||
        (p.preview || '').toLowerCase().indexOf(q) !== -1 ||
        (p.impact || '').toLowerCase().indexOf(q) !== -1 ||
        (p.meta && p.meta.technology || '').toLowerCase().indexOf(q) !== -1;

      if (catMatch && searchMatch) {
        grid.appendChild(buildCard(p));
        visible++;
      }
    });

    noRes.style.display  = visible === 0 ? 'block' : 'none';
    grid.style.display   = visible === 0 ? 'none'  : '';
  }

  // ── Search ───────────────────────────────────────────────────────
  var searchInput = document.getElementById('proj-search');
  
  searchInput.addEventListener('input', function () {
    searchQuery = this.value;
    renderGrid();
    
    // Clear previous active filter if searching
    if (searchQuery && activeFilter !== 'all') {
      activeFilter = 'all';
      document.querySelectorAll('.proj-filter-btn').forEach(function (b) {
        b.classList.remove('active');
      });
      document.querySelector('[data-cat="all"]').classList.add('active');
    }
  });

  // Keyboard navigation for search
  searchInput.addEventListener('keydown', function (e) {
    if (e.key === 'Escape') {
      this.value = '';
      searchQuery = '';
      renderGrid();
      this.blur();
    }
  });

  // Clear search button
  var clearBtn = document.createElement('button');
  clearBtn.innerHTML = '×';
  clearBtn.className = 'search-clear';
  clearBtn.style.cssText = 'position: absolute; right: 12px; top: 50%; transform: translateY(-50%); background: none; border: none; color: var(--text3); font-size: 1.2rem; cursor: pointer; padding: 0; width: 20px; height: 20px; display: none;';
  clearBtn.onclick = function () {
    searchInput.value = '';
    searchQuery = '';
    renderGrid();
    clearBtn.style.display = 'none';
    searchInput.focus();
  };
  
  searchInput.parentNode.style.position = 'relative';
  searchInput.parentNode.appendChild(clearBtn);
  
  // Show/hide clear button
  searchInput.addEventListener('input', function () {
    clearBtn.style.display = this.value ? 'block' : 'none';
  });

  // ── Search matching ───────────────────────────────────────────────
  function highlightSearchTerm(text, term) {
    if (!term) return text;
    var regex = new RegExp('(' + term.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + ')', 'gi');
    return text.replace(regex, '<mark>$1</mark>');
  }

  function applyUrlState() {
    var params = new URLSearchParams(window.location.search);
    var q = params.get('q');
    var cat = params.get('cat');

    if (q) {
      searchQuery = q;
      searchInput.value = q;
      clearBtn.style.display = 'block';
    }

    if (cat && (cat === 'all' || CAT_ORDER.indexOf(cat) !== -1)) {
      activeFilter = cat;
      document.querySelectorAll('.proj-filter-btn').forEach(function (b) {
        b.classList.toggle('active', b.dataset.cat === cat);
      });
    }
  }

  // ── Init ─────────────────────────────────────────────────────────────────
  buildSummary();
  buildFilters();
  applyUrlState();
  renderGrid();

})();
</script>
